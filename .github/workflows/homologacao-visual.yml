name: Homologacao visual (Workers)

on:
  workflow_dispatch:
  push:
    branches: [fix/p3-forecast-e-importacao]
    paths-ignore:
      - ".scratch/**"
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: homologacao-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      - name: Build visual (fixtures sinteticas, sem API)
        run: npm run build:visual

      - name: Deploy homologacao
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dist/visual/latest.json','utf8')).directory;const c=JSON.parse(fs.readFileSync('wrangler.visual.jsonc','utf8'));c.assets.directory='./'+d+'/assets';fs.writeFileSync('wrangler.visual.runtime.jsonc',JSON.stringify(c,null,1))"
          npx wrangler deploy -c wrangler.visual.runtime.jsonc
